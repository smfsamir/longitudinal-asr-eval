name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c requirements.txt -e '.[dev]'
      - run: ruff check longitudinal_asr tests
      - run: pytest -q
      - run: asr-eval demo --output outputs/demo
